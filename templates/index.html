<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>AI Image App - Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Image Application</h1>
            <nav>
                <a href="{{ url_for('index') }}" class="active">Upload Selfie</a>
                <a href="{{ url_for('generate') }}">Generate Image</a>
            </nav>
        </header>

        <main>
            <h2>Upload Your Selfie</h2>
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                <ul class="flashes">
                {% for category, message in messages %}
                  <li class="{{ category }}">{{ message }}</li>
                {% endfor %}
                </ul>
              {% endif %}
            {% endwith %}
            <form method="POST" action="{{ url_for('upload_file') }}" enctype="multipart/form-data">
                <p>
                    <label for="image">Choose an image (png, jpg, jpeg):</label>
                    <input type="file" name="image" id="image" required accept=".png,.jpg,.jpeg">
                </p>
                <p><input type="submit" value="Upload Image"></p>
            </form>
        </main>
        <footer>
            <p class="text-center">&copy; 2024 AI Image App</p>
        </footer>
    </div>
</body>
</html>
